services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pickup
      POSTGRES_PASSWORD: pickup
      POSTGRES_DB: pickup_counter
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickup -d pickup_counter"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://pickup:pickup@postgres:5432/pickup_counter
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret-change-me}
      HOLD_SECONDS: ${HOLD_SECONDS:-120}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - api

  api-test:
    profiles: ["test"]
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://pickup:pickup@postgres:5432/pickup_counter_test
      TEST_DATABASE_URL: postgres://pickup:pickup@postgres:5432/pickup_counter_test
      WEBHOOK_SECRET: test-webhook-secret
      HOLD_SECONDS: "120"
    depends_on:
      postgres:
        condition: service_healthy
    command: npm test

volumes:
  pgdata:
